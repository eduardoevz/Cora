services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cora_user
      POSTGRES_PASSWORD: cora_password
      POSTGRES_DB: cora_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cora_user -d cora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
