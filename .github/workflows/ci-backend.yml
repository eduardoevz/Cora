name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Strict Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Strict Type Check
        run: mypy --strict app scripts tests

  test-and-coverage:
    name: Pytest & Coverage (pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cora_user
          POSTGRES_PASSWORD: cora_password
          POSTGRES_DB: cora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://cora_user:cora_password@localhost:5432/cora_test
          ENVIRONMENT: testing
          API_V1_STR: /api/v1
          PROJECT_NAME: Cora Clinical Backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
