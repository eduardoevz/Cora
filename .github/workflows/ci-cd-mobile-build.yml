name: Mobile Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --fatal-infos

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build Universal APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cora-android-appbundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cora-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
